<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>SKZ VR</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font:15px -apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none}
#rv{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:fill;background:#000;z-index:1}
#out{position:fixed;left:0;top:0;width:100%;height:100%;display:none;z-index:2}
body.warp #out{display:block}
#intro{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;z-index:5;background:linear-gradient(#22345a,#0b1020)}
#introIn{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
#intro h1{margin:0;font-size:22px}
#intro p{margin:0;max-width:520px;color:#c8d3ea;line-height:1.4;font-size:14px}
#msg{white-space:pre-line;text-align:left;min-height:20px;color:#9fe3b8;font-size:13px;max-width:520px;line-height:1.35}
#msg.err{color:#ffb4a8}
#pc{font:18px ui-monospace,Menlo,monospace;text-align:center;height:44px;width:250px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;-webkit-user-select:text;user-select:text;outline:0}
label{font-size:13px;color:#c8d3ea}
button{font:inherit;color:inherit;background:rgba(255,255,255,.16);border-radius:22px;height:44px;padding:0 18px;border:1px solid rgba(255,255,255,.22)}
button.main{background:#fff;color:#0d1118;font-weight:700;height:52px;padding:0 34px;font-size:17px;border-radius:26px}
button:active{transform:scale(.96)}
button:disabled{opacity:.5}
#bar{position:fixed;left:0;right:0;top:0;z-index:7;display:none;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px;background:rgba(0,0,0,.65)}
#bar.on{display:flex}
#bar button{height:38px;padding:0 13px;font-size:14px}
#bar button.on{background:#4a9dff;border-color:#4a9dff}
#stat{font:12px ui-monospace,Menlo,monospace;color:#cfe;min-width:90px;text-align:center}
#dbg{position:fixed;left:8px;bottom:6px;z-index:6;font:11px/1.35 ui-monospace,Menlo,monospace;color:#9fe3b8;background:rgba(0,0,0,.65);padding:5px 9px;border-radius:8px;white-space:pre;display:none;pointer-events:none}
#dbg.on{display:block}
#rot{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(11,16,32,.92);text-align:center;font-size:18px;padding:30px;pointer-events:none}
@media (orientation:portrait){body.run #rot{display:flex}}
@media (max-height:430px){#intro p.long{display:none}#intro h1{font-size:18px}#introIn{gap:8px;padding:10px}}
</style>
</head>
<body>
<video id="rv" playsinline autoplay></video>
<canvas id="out"></canvas>
<div id="intro"><div id="introIn">
  <h1>SKZ VR · tela do celular</h1>
  <p class="long">O jogo roda no PC. Este app mostra a imagem, toca o som e envia o giroscópio e a câmera (para rastrear suas mãos). Deixe o celular na <b>horizontal</b>.</p>
  <label for="pc">IP do PC (aparece na janela preta do servidor)</label>
  <input id="pc" type="text" inputmode="decimal" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="192.168.0.15">
  <button class="main" id="go">Conectar</button>
  <div id="msg"></div>
</div></div>
<div id="bar">
  <span id="stat">—</span>
  <button id="bVR">Modo VR</button>
  <button id="bRe">Recentralizar</button>
  <button id="bWp">Correção de cabeça</button>
  <span><button id="bLm">−</button> <span id="lat" style="display:inline-block;min-width:54px;text-align:center;font:13px ui-monospace,monospace">60 ms</span> <button id="bLp">+</button></span>
  <button id="bX">Sair</button>
</div>
<div id="dbg"></div>
<div id="rot">Gire o celular para a horizontal</div>
<script src="phone.js"></script>
</body>
</html>
